    datatype: yesnoradio
---
id: exit non resident
event: exit_non_resident
question: Sorry, this is not the right form for you
---
id: Limit_your_rent_increase
continue button field: limit_your_rent_increase_intro
question: |
  Limit your rent
subquestion: |
  If you rent, you can use this tool to fight a rent hike.
  
  Before you start, get your lease, bills, and fee records.

  After you finish, sign and mail the letter. Keep a copy for your records.

  Most people take about 10 minutes.
---
id: Rent now
question: |
  Rent now
subquestion: |
  Enter your rent now.
fields:
  - "Rent now": current_rent_amount
    datatype: currency
    min: 0
---
id: Current Rent Extras
question: |
  Costs now
subquestion: |
  Fill in the numbers for extra costs you pay.

  Include late fees, parking rent, water or heat fees, and pay fees.
fields:
  - "Late fees now": current_late_fees
    datatype: currency
    min: 0
  - "Other rent now": current_other_rents
    datatype: currency
    min: 0
  - "Other fees now": current_other_fees
    datatype: currency
    min: 0
  - "Utility fees now": current_utilities_excess
    datatype: currency
    min: 0
---
id: Current Rent Total
question: |
  Total rent now
subquestion: |
  This is your total rent now
fields:
  - "Total rent now": current_rent_total
    datatype: currency
    min: 0
---
id: New base rent
question: |
  New base rent
subquestion: |
  What is the new rent your owner wants to charge you?
fields:
  - "New base rent": proposed_rent_amount
    datatype: currency
    min: 0
---
id: Proposed extra fees
question: |
  New extra fees
subquestion: |
  Does your owner want you to keep paying extra fees?

  If so, include them below.
fields:
  - "New late fees": proposed_late_fees
    datatype: currency
    min: 0
  - "New other rent": proposed_other_rents
    datatype: currency
    min: 0
  - "New other fees": proposed_other_fees_average
    datatype: currency
    min: 0
  - "New utility fees": proposed_utilities_excess
    datatype: currency
    min: 0
---
id: New Total Rent
question: |
  New total rent
subquestion: |
  This is your new total rent.
fields:
  - "New total rent": proposed_rent_total
    datatype: currency
    min: 0
---
id: Rent raise rate
question: |
  Rent raise rate
subquestion: |
  This is the rate your rent will go up.

  The city of St. Paul caps rent hikes at 3%.
fields:
  - "Rent raise rate": rent_increase_percent
    maxlength: 6
  - "Rate": percent_rent_increase
    maxlength: 4
