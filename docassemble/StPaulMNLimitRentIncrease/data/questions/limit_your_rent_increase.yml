metadata:
  title: >-
    Limit your rent increase in St. Paul
  short title: >-
    Limit your rent
  description: |-
    This interview helps someone living in St. Paul, Minnesota limit their rent increase
    under St. Paul's rent control rules if the amount of the increase is more than 3%.
    The interview will generate a letter to the landlord to fight the increase, and 
    instructions for next steps.

    It will help you figure out what charges are allowed. It will also help you gather 
    information about your landlord and any other tenants in your building who are also
    getting a rent increase.

    The original letter was created by HOME Line, a tenant advocacy organization in Minnesota. You can get free
    legal advice from HOME Line by calling their hotline at <a href="tel:612-728-5767">612-728-5767</a>.
  can_I_use_this_form: |
    If you are a renter in St. Paul, Minnesota and your landlord is trying to raise your
    rent more than 3%, you can use this interview to send a letter to your landlord to
    fight the increase.
  before_you_start: |
    Before you get started, gather:
    
    1. Your lease agreement
    2. Any utilities you pay for
    3. Records of any other fees you paid to the Landlord
  when_you_are_finished: |
    1. Call the HOME Line to speak with a tenant advocate at 612-728-5767.
    2. Sign and date the letter.
    3. Make a copy of the letter and keep it.
    4. Send the original letter to the landlord or property manager. Certified mail is best, but first class mail also works.
    5. Write down the date you mailed the letter.
    6. If you have not heard from the landlord in 7 days, file a complaint with the City of St. Paul.
  maturity: production
  estimated_completion_minutes: 10
  estimated_completion_delta: 5
