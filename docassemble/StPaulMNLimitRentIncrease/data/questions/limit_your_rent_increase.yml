#################### Interview order #####################
comment: |
  Controls order and branching logic for questions specific to this form
id: interview_order_limit_your_rent_increase
code: |
  # Set the allowed courts for this interview
  nav.set_section("review_limit_your_rent_increase")
  user_role = "defendant"
  user_ask_role = "defendant"

  if not lives_in_stpaul:
    exit_non_resident

  users.gather()
  set_parts(subtitle=str(users))
  current_rent_amount
  current_late_fees
  set_progress(16)
  current_rent_total
  proposed_rent_amount
  proposed_late_fees
  set_progress(32)
  proposed_rent_total
  rent_increase_percent
  other_parties.gather()
  set_progress(48)
  other_parties[0].address.address
  users[0].address.address
  signature_date
  interview_order_limit_your_rent_increase = True
---
###################### Main order ######################
comment: |
  This block includes the logic for standalone interviews.
  Delete mandatory: True to include in another interview
mandatory: True
code: |
  al_intro_screen
  limit_your_rent_increase_intro
  interview_order_limit_your_rent_increase
  signature_date
  # Store anonymous data for analytics / statistics
  store_variables_snapshot(
    persistent=True,
    data={
      "zip": showifdef("users[0].address.zip"),
      "reached_interview_end": True,
    },
  )
  limit_your_rent_increase_download
